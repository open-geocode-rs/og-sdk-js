name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - name: Package checks (publint, are-the-types-wrong)
        run: bun run check:packages
      - name: Size budget
        run: bun run size
      - name: API reference builds without warnings
        run: bun run docs
      - name: README provider tables match the adapters
        run: bun run docs:capabilities && git diff --exit-code packages/client/README.md
      - name: Bundles in a real Vite app
        run: cd ecosystem-tests/vite && bunx vite build --logLevel warn
      - name: An adapter pulls in no other provider
        run: node ecosystem-tests/treeshake/check.mjs
      - name: Install browsers
        run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist

  runtimes:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node smoke.mjs
        working-directory: ecosystem-tests/runtimes
      - run: bun smoke.mjs
        working-directory: ecosystem-tests/runtimes
      - run: deno run --allow-read --allow-env smoke.mjs
        working-directory: ecosystem-tests/runtimes
