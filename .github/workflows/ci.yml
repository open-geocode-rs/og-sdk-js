name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - name: Package checks (publint, are-the-types-wrong)
        run: bun run check:packages
      - name: Size budget
        run: bun run size
      - name: API reference builds without warnings
        run: bun run docs
      - name: Bundles in a real Vite app
        run: cd ecosystem-tests/vite && bunx vite build --logLevel warn
      - name: A client pulls in no other vendor
        run: node ecosystem-tests/treeshake/check.mjs
      - name: Install browsers
        run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist

  og:
    # The og-backed suites, against the pinned og on a Monaco Pack and on a
    # calibrated Rhode Island Pack, both built from OSM extracts here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: og
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build og
        run: cargo build --release --locked --bin open-geocode
        working-directory: og
      - name: Build the test Packs and serve og on each
        run: ecosystem-tests/og/serve.sh og/target/release/open-geocode "$RUNNER_TEMP/og" 18900 18901 >> "$GITHUB_ENV"
      - name: Every suite, the og-backed ones included
        run: bun run test
        env:
          OG_TEST_ADDRESS: 12 Boulevard des Moulins Monaco
      - name: og logs
        if: failure()
        run: tail -n 50 "$RUNNER_TEMP"/og/*.log

  runtimes:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node smoke.mjs
        working-directory: ecosystem-tests/runtimes
      - run: bun smoke.mjs
        working-directory: ecosystem-tests/runtimes
      - run: deno run --allow-read --allow-env --allow-net=127.0.0.1 smoke.mjs
        working-directory: ecosystem-tests/runtimes
